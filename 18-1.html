<!DOCTYPE html>
<html lang="zh-CN">
<!-- 姓名：李知芸  日期：2026-11-05  功能名称：18-1 Canvas 粒子文字动画 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-1 Canvas 粒子文字动画 · 李知芸</title>
<style>
    :root{
        --li_bg:#05060b;
        --li_ink:#ffffff;
        --li_muted:#9aa6bd;
        --li_c1:#6d7cff;
        --li_c2:#5fd8c8;
        --li_c3:#c4b5fd;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
        background:
            radial-gradient(1200px 800px at 55% 40%, rgba(109,124,255,.15) 0%, rgba(5,6,11,0) 62%),
            radial-gradient(900px 700px at 82% 92%, rgba(95,216,200,.10) 0%, rgba(5,6,11,0) 60%),
            var(--li_bg);
        color:var(--li_ink);
        font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
        overflow:hidden;
        -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility;
    }

    /* ===== 全屏画布 ===== */
    #li_canvas{
        position:fixed;
        inset:0;
        display:block;
        width:100%;
        height:100%;
        z-index:0;
        cursor:crosshair;
    }

    /* ===== 顶部栏 ===== */
    .li_topbar{
        position:fixed;top:0;left:0;right:0;z-index:5;
        display:flex;align-items:center;justify-content:space-between;
        padding:18px 32px;
        pointer-events:none;
    }
    .li_topbar > *{pointer-events:auto;}
    .li_brand{
        display:flex;align-items:center;gap:10px;
        font-family:ui-monospace,"SF Mono","Consolas",monospace;
        font-size:10px;font-weight:600;letter-spacing:4px;
        color:#b4bed2;text-transform:uppercase;
    }
    .li_dot{
        width:6px;height:6px;border-radius:50%;
        background:linear-gradient(135deg,var(--li_c1),var(--li_c2));
        box-shadow:0 0 12px rgba(109,124,255,.9);
        animation:liPulse 2.4s ease-in-out infinite;
    }
    @keyframes liPulse{
        0%,100%{opacity:1;transform:scale(1);}
        50%{opacity:.4;transform:scale(.65);}
    }
    .li_back{
        display:inline-flex;align-items:center;gap:8px;
        padding:8px 16px;
        border:1px solid rgba(255,255,255,.14);
        border-radius:999px;
        background:rgba(255,255,255,.04);
        backdrop-filter:blur(8px);
        -webkit-backdrop-filter:blur(8px);
        color:#dfe6f5;text-decoration:none;
        font-size:12px;letter-spacing:1px;
        transition:background .25s ease,border-color .25s ease,transform .25s ease;
    }
    .li_back:hover{
        background:rgba(255,255,255,.1);
        border-color:rgba(196,181,253,.55);
        transform:translateY(-1px);
    }

    /* ===== 左上说明 ===== */
    .li_intro{
        position:fixed;left:40px;top:98px;z-index:4;
        max-width:360px;pointer-events:none;
        animation:liFade .9s cubic-bezier(.2,.7,.2,1) .15s backwards;
    }
    .li_eyebrow{
        display:flex;align-items:center;gap:12px;
        margin-bottom:16px;
        font-family:ui-monospace,"SF Mono","Consolas",monospace;
        font-size:10px;font-weight:600;letter-spacing:4px;
        text-transform:uppercase;color:#8f9bb3;
    }
    .li_eyebrow::before{
        content:"";width:30px;height:1px;
        background:linear-gradient(90deg,var(--li_c1),transparent);
    }
    .li_title{
        margin-bottom:14px;
        font-size:clamp(26px,3vw,38px);
        font-weight:800;letter-spacing:1px;line-height:1.15;
        background:linear-gradient(94deg,#ffffff 20%,var(--li_c3) 92%);
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;color:transparent;
    }
    .li_sub{
        margin:0;
        font-size:13px;line-height:1.95;color:var(--li_muted);
        font-weight:400;
    }
    @keyframes liFade{
        from{opacity:0;transform:translateY(14px);}
        to{opacity:1;transform:translateY(0);}
    }

    /* ===== 底部状态栏 ===== */
    .li_hud_bottom{
        position:fixed;left:40px;right:40px;bottom:26px;z-index:4;
        display:flex;align-items:center;justify-content:space-between;gap:16px;
        font-size:12px;letter-spacing:.5px;color:#8f9bb3;
        pointer-events:none;
        animation:liFade .9s cubic-bezier(.2,.7,.2,1) .35s backwards;
    }
    .li_hud_bottom b{
        color:#dfe6f5;font-weight:600;
        font-family:ui-monospace,"SF Mono","Consolas",monospace;
    }
    .li_stat{white-space:nowrap;}
    .li_hintTouch{display:none;}
    @media (hover:none) and (pointer:coarse){
        .li_hintDesktop{display:none;}
        .li_hintTouch{display:inline;}
    }

    @media (max-width:900px){
        .li_topbar{padding:16px 20px;}
        .li_intro{left:20px;right:20px;top:86px;max-width:460px;}
        .li_sub{font-size:12.5px;}
        .li_hud_bottom{left:20px;right:20px;bottom:18px;font-size:11px;}
    }
    @media (max-height:620px){
        .li_intro{top:74px;}
        .li_title{font-size:24px;}
        .li_sub{display:none;}
    }
    @media (prefers-reduced-motion:reduce){
        .li_dot,.li_intro,.li_hud_bottom{animation:none;}
    }
</style>
</head>
<body>
    <canvas id="li_canvas" role="img" aria-label="由数千颗粒子拼成的“李知芸”三个字，下方是一行较小的英文与学号信息；鼠标移动时粒子被推开，点击画布后粒子爆散并重新聚合"></canvas>

    <header class="li_topbar">
        <div class="li_brand"><span class="li_dot"></span>Advanced Web Design</div>
        <a class="li_back" href="index.html">返回首页 →</a>
    </header>

    <section class="li_intro">
        <p class="li_eyebrow">Canvas 2D · Particle Text</p>
        <h1 class="li_title">粒子文字动画</h1>
        <p class="li_sub">读取 Canvas 像素点，把“李知芸”三个字拆成数千颗粒子重新拼合。移动鼠标扰动粒子，单击画布让它们爆散后再慢慢归位。</p>
    </section>

    <footer class="li_hud_bottom">
        <span><span class="li_hintDesktop">移动鼠标扰动粒子 · 单击画布爆散重聚</span><span class="li_hintTouch">手指拖动扰动粒子 · 轻触画布爆散重聚</span></span>
        <span class="li_stat">粒子数 <b id="li_particleCount">0</b></span>
    </footer>

<script>
(function () {
    "use strict";

    var li_canvas = document.getElementById("li_canvas");
    var li_ctx = li_canvas.getContext("2d");
    var li_countEl = document.getElementById("li_particleCount");

    var li_W = 0;
    var li_H = 0;
    var li_dpr = 1;
    var li_center = { x: 0, y: 0 };
    var li_particles = [];
    var li_buckets = [];
    var li_stars = [];
    var li_mouse = { x: -9999, y: -9999, active: false };
    var li_glow = null;
    var li_start = 0;
    var li_resizeTimer = 0;

    /* 粒子颜色，按文字从左到右的渐变分配 */
    var li_palette = [
        "rgba(95,216,200,0.92)",
        "rgba(124,196,255,0.95)",
        "rgba(140,224,255,0.90)",
        "rgba(109,124,255,0.95)",
        "rgba(167,139,250,0.95)",
        "rgba(196,181,253,0.92)",
        "rgba(196,181,253,0.62)",
        "rgba(124,196,255,0.56)"
    ];

    function li_rand(a, b) {
        return a + Math.random() * (b - a);
    }

    /* ===== 背景星点 ===== */
    function li_buildStars() {
        li_stars = [];
        var n = Math.round(Math.min(150, (li_W * li_H) / 15000));
        for (var i = 0; i < n; i++) {
            li_stars.push({
                x: Math.random() * li_W,
                y: Math.random() * li_H,
                r: li_rand(0.4, 1.5),
                a: li_rand(0.08, 0.34),
                vy: li_rand(0.015, 0.11),
                phase: li_rand(0, Math.PI * 2)
            });
        }
    }

    /* ===== 采样文字像素，生成粒子 ===== */
    function li_sampleText() {
        var wide = li_W >= 1200;
        var cx = wide ? li_W * 0.60 : li_W * 0.5;
        var cy = wide ? li_H * 0.54 : li_H * 0.62;
        li_center.x = cx;
        li_center.y = cy;

        var fs = Math.min(li_W * 0.215, li_H * 0.30, 300);
        fs = Math.min(fs, (li_W * 0.86) / 3);
        var subFs = Math.max(12, Math.min(fs * 0.17, 34));

        var off = document.createElement("canvas");
        off.width = Math.max(1, Math.ceil(li_W));
        off.height = Math.max(1, Math.ceil(li_H));
        var octx = off.getContext("2d");

        octx.fillStyle = "#ffffff";
        octx.textAlign = "center";
        octx.textBaseline = "middle";

        octx.font = '800 ' + fs.toFixed(1) + 'px "PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
        octx.fillText("李知芸", cx, cy);

        var sub = "LI ZHIYUN  ·  527  ·  计算机24005";
        octx.font = '700 ' + subFs.toFixed(1) + 'px ui-monospace,"SF Mono","Consolas",monospace';
        var subW = octx.measureText(sub).width;
        var maxSubW = li_W * 0.82;
        if (subW > maxSubW) {
            subFs = subFs * maxSubW / subW;
            octx.font = '700 ' + subFs.toFixed(1) + 'px ui-monospace,"SF Mono","Consolas",monospace';
        }
        var subY = cy + fs * 0.68;
        octx.fillText(sub, cx, subY);

        var img = octx.getImageData(0, 0, off.width, off.height).data;
        var step = Math.max(3, Math.round(fs / 62));
        var stepSub = Math.max(2, Math.round(step * 0.5));
        var subTop = cy + fs * 0.5;
        var list = [];
        var spawnBase = Math.max(li_W, li_H);

        function li_push(px, py, jitter, isSub) {
            var idx;
            if (isSub) {
                idx = px < cx ? 7 : 6;
            } else {
                var rel = (px - cx) / (fs * 1.5);
                idx = Math.max(0, Math.min(5, Math.round((rel + 1) * 2.5)));
                if (Math.random() < 0.22) {
                    idx = Math.max(0, Math.min(5, idx + (Math.random() < 0.5 ? -1 : 1)));
                }
            }
            var ang = Math.random() * Math.PI * 2;
            var rad = spawnBase * li_rand(0.48, 0.92);
            list.push({
                tx: px + (Math.random() - 0.5) * jitter,
                ty: py + (Math.random() - 0.5) * jitter,
                x: cx + Math.cos(ang) * rad,
                y: cy + Math.sin(ang) * rad,
                vx: 0,
                vy: 0,
                size: isSub ? li_rand(0.9, 1.5) : li_rand(1.1, 2.1),
                color: idx,
                phase: Math.random() * Math.PI * 2
            });
        }

        var x, y;
        for (y = 0; y < subTop; y += step) {
            for (x = 0; x < off.width; x += step) {
                if (img[(y * off.width + x) * 4 + 3] > 130) {
                    li_push(x, y, step * 0.7, false);
                }
            }
        }
        for (y = Math.round(subTop); y < off.height; y += stepSub) {
            for (x = 0; x < off.width; x += stepSub) {
                if (img[(y * off.width + x) * 4 + 3] > 130) {
                    li_push(x, y, stepSub * 0.7, true);
                }
            }
        }

        li_particles = list;
        li_buckets = [[], [], [], [], [], [], [], []];
        for (var i = 0; i < list.length; i++) {
            li_buckets[list[i].color].push(list[i]);
        }
        if (li_countEl) {
            li_countEl.textContent = list.length.toLocaleString("zh-CN");
        }
    }

    /* ===== 尺寸与高清屏适配 ===== */
    function li_resize() {
        li_dpr = Math.min(window.devicePixelRatio || 1, 2);
        li_W = window.innerWidth;
        li_H = window.innerHeight;

        li_canvas.width = Math.round(li_W * li_dpr);
        li_canvas.height = Math.round(li_H * li_dpr);
        li_canvas.style.width = li_W + "px";
        li_canvas.style.height = li_H + "px";
        li_ctx.setTransform(li_dpr, 0, 0, li_dpr, 0, 0);

        li_buildStars();
        li_sampleText();

        li_glow = li_ctx.createRadialGradient(
            li_center.x, li_center.y, 0,
            li_center.x, li_center.y, Math.max(li_W, li_H) * 0.55
        );
        li_glow.addColorStop(0, "rgba(109,124,255,0.14)");
        li_glow.addColorStop(0.5, "rgba(95,216,200,0.05)");
        li_glow.addColorStop(1, "rgba(109,124,255,0)");
    }

    /* ===== 点击爆散 ===== */
    function li_burst(bx, by) {
        for (var i = 0; i < li_particles.length; i++) {
            var p = li_particles[i];
            var dx = p.x - bx;
            var dy = p.y - by;
            var d = Math.sqrt(dx * dx + dy * dy) || 1;
            var f = 3 + Math.random() * 9;
            p.vx += (dx / d) * f;
            p.vy += (dy / d) * f;
        }
    }

    /* ===== 渲染循环 ===== */
    function li_frame(now) {
        if (!li_start) li_start = now;
        var t = now - li_start;
        var ctx = li_ctx;

        ctx.clearRect(0, 0, li_W, li_H);

        /* 中心环境光 */
        if (li_glow) {
            ctx.fillStyle = li_glow;
            ctx.fillRect(0, 0, li_W, li_H);
        }

        /* 星点 */
        for (var s = 0; s < li_stars.length; s++) {
            var st = li_stars[s];
            st.y += st.vy;
            if (st.y > li_H + 2) {
                st.y = -2;
                st.x = Math.random() * li_W;
            }
            var tw = 0.6 + 0.4 * Math.sin(t * 0.001 + st.phase);
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, 6.2832);
            ctx.fillStyle = "rgba(180,200,255," + (st.a * tw).toFixed(3) + ")";
            ctx.fill();
        }

        /* 鼠标位置的光晕 */
        if (li_mouse.active) {
            var mg = ctx.createRadialGradient(li_mouse.x, li_mouse.y, 0, li_mouse.x, li_mouse.y, 150);
            mg.addColorStop(0, "rgba(109,124,255,0.16)");
            mg.addColorStop(1, "rgba(109,124,255,0)");
            ctx.fillStyle = mg;
            ctx.beginPath();
            ctx.arc(li_mouse.x, li_mouse.y, 150, 0, 6.2832);
            ctx.fill();
        }

        /* 粒子物理：弹簧归位 + 鼠标斥力 */
        var mx = li_mouse.x;
        var my = li_mouse.y;
        var active = li_mouse.active;
        var R = 130;
        var R2 = R * R;
        var i, p;

        for (i = 0; i < li_particles.length; i++) {
            p = li_particles[i];

            if (active) {
                var ddx = p.x - mx;
                var ddy = p.y - my;
                var d2 = ddx * ddx + ddy * ddy;
                if (d2 < R2 && d2 > 0.5) {
                    var d = Math.sqrt(d2);
                    var push = (1 - d / R) * 0.9;
                    p.vx += (ddx / d) * push * 1.15;
                    p.vy += (ddy / d) * push * 1.15;
                }
            }

            p.vx += (p.tx - p.x) * 0.028;
            p.vy += (p.ty - p.y) * 0.028;
            p.vx *= 0.88;
            p.vy *= 0.88;

            if (p.vx > 22) p.vx = 22; else if (p.vx < -22) p.vx = -22;
            if (p.vy > 22) p.vy = 22; else if (p.vy < -22) p.vy = -22;

            p.x += p.vx;
            p.y += p.vy;
        }

        /* 按颜色分组批量绘制，减少状态切换 */
        ctx.globalCompositeOperation = "lighter";
        for (var b = 0; b < li_buckets.length; b++) {
            var bucket = li_buckets[b];
            if (!bucket.length) continue;
            ctx.beginPath();
            for (var j = 0; j < bucket.length; j++) {
                var q = bucket[j];
                var size = q.size * (0.78 + 0.22 * Math.sin(t * 0.0022 + q.phase));
                var ox = Math.sin(t * 0.0016 + q.phase) * 0.5;
                var oy = Math.cos(t * 0.0013 + q.phase) * 0.5;
                ctx.rect(q.x + ox - size / 2, q.y + oy - size / 2, size, size);
            }
            ctx.fillStyle = li_palette[b];
            ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";

        requestAnimationFrame(li_frame);
    }

    /* ===== 交互事件 ===== */
    window.addEventListener("pointermove", function (e) {
        li_mouse.x = e.clientX;
        li_mouse.y = e.clientY;
        li_mouse.active = true;
    });
    document.addEventListener("pointerleave", function () {
        li_mouse.active = false;
    });
    window.addEventListener("blur", function () {
        li_mouse.active = false;
    });

    li_canvas.addEventListener("pointerdown", function (e) {
        li_mouse.x = e.clientX;
        li_mouse.y = e.clientY;
        li_mouse.active = true;
        li_burst(e.clientX, e.clientY);
    });

    window.addEventListener("resize", function () {
        clearTimeout(li_resizeTimer);
        li_resizeTimer = setTimeout(li_resize, 160);
    });

    /* ===== 启动 ===== */
    li_resize();
    requestAnimationFrame(li_frame);
})();
</script>
</body>
</html>
