<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数7游戏</title>
    <style>
        .lzy_body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .lzy_grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }
        .lzy_box {
            width: 70px;
            height: 70px;
            border: 1px solid #2c6ecb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #2c6ecb;
            background-color: #f5f9ff;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        .lzy_empty {
            border: 1px dashed #c7254e;
            background-color: #fff5f5;
        }
        .lzy_tip {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body class="lzy_body">
    <!-- 姓名：李知芸  日期：2026-10-26  功能名称：数7游戏（100个盒子） -->
    <h2>李知芸：数7游戏</h2>
    <p class="lzy_tip">规则：1~100 中，凡是 7 的倍数或数字中含有 7（如末尾是 7）的盒子输出为空盒子，其余盒子显示数字。</p>
    <div class="lzy_grid" id="lzy_grid"></div>

    <script>
        // 判断是否符合"数7"规则：7 的倍数或数字中含有 7
        function lzy_isSeven(lzy_num) {
            if (lzy_num % 7 === 0) {
                return true;
            }
            // 转成字符串检查是否包含数字 7（如 17、70~79、97 等）
            if (String(lzy_num).indexOf("7") !== -1) {
                return true;
            }
            return false;
        }

        // 生成 100 个盒子
        var lzy_grid = document.getElementById("lzy_grid");
        for (var lzy_i = 1; lzy_i <= 100; lzy_i++) {
            var lzy_box = document.createElement("div");
            if (lzy_isSeven(lzy_i)) {
                // 满足规则：空盒子
                lzy_box.className = "lzy_box lzy_empty";
                lzy_box.textContent = "";
            } else {
                // 不满足规则：盒子内部显示数字
                lzy_box.className = "lzy_box";
                lzy_box.textContent = lzy_i;
            }
            lzy_grid.appendChild(lzy_box);
        }
    </script>
</body>
</html>
