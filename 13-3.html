<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>字体图标 - 底部导航</title>
    <link rel="stylesheet" href="cdn/iconfont.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            padding-bottom: 70px;
        }
        .page-content {
            padding: 20px;
            text-align: center;
            padding-top: 60px;
        }
        .page-content h2 { color: #333; margin-bottom: 10px; }
        .page-content p { color: #999; font-size: 14px; }

        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #fff;
            display: flex;
            border-top: 1px solid #e8e8e8;
            z-index: 999;
        }
        .tabbar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #999;
            position: relative;
            transition: color 0.3s;
        }
        .tabbar-item.active { color: #1890ff; }
        .tabbar-item .iconfont {
            font-size: 24px;
            line-height: 1;
        }
        .tabbar-item .label {
            font-size: 11px;
            margin-top: 4px;
        }
        .tabbar-item .badge {
            position: absolute;
            top: 6px;
            right: calc(50% - 22px);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: #ff4d4f;
            color: #fff;
            font-size: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .tabbar-item .dot {
            position: absolute;
            top: 8px;
            right: calc(50% - 20px);
            width: 8px;
            height: 8px;
            background: #ff4d4f;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="page-content">
        <h2>字体图标导航</h2>
        <p>使用 iconfont 字体文件渲染底部导航图标</p>
    </div>

    <nav class="tabbar">
        <a href="#" class="tabbar-item active">
            <i class="iconfont icon-shouye"></i>
            <span class="label">首页</span>
        </a>
        <a href="#" class="tabbar-item">
            <i class="iconfont icon-jianshenfang"></i>
            <span class="label">健身房</span>
            <span class="badge">8</span>
        </a>
        <a href="#" class="tabbar-item">
            <i class="iconfont icon-search"></i>
            <span class="label">搜索</span>
            <span class="dot"></span>
        </a>
        <a href="#" class="tabbar-item">
            <i class="iconfont icon-jianshen"></i>
            <span class="label">健身</span>
        </a>
        <a href="#" class="tabbar-item">
            <i class="iconfont icon-denglu"></i>
            <span class="label">我的</span>
        </a>
    </nav>
</body>
</html>
