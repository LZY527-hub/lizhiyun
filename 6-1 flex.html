<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 姓名：李知芸  日期：2026-11-03  功能名称：Flex 弹性布局练习 -->
    <title>527李知芸 · Flex 弹性布局</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }

        .lzy_title {
            margin: 38px 0 34px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #111111;
        }

        .lzy_flex {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .lzy_box {
            width: 204px;
            height: 225px;
            padding: 20px;
            background: #2f7f74;
            display: flex;
        }

        .lzy_item {
            background: #f4a259;
        }

        /* 第一个：单个方块水平垂直居中 */
        .lzy_box1 {
            justify-content: center;
            align-items: center;
        }

        .lzy_item1 {
            width: 78px;
            height: 48px;
        }

        /* 第二个：两个方块纵向排列并居中 */
        .lzy_box2 {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .lzy_item2 {
            width: 76px;
            height: 58px;
        }

        /* 第三个：四个方块两行两列 */
        .lzy_box3 {
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 8px;
        }

        .lzy_item3 {
            width: 80px;
            height: 58px;
        }

        /* 第四个：上方通栏，下方两块按比例分配 */
        .lzy_box4 {
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .lzy_item4-top {
            width: 100%;
            height: 56px;
        }

        .lzy_row {
            display: flex;
            gap: 8px;
            height: 68px;
        }

        .lzy_item4-left {
            flex: 2;
        }

        .lzy_item4-right {
            flex: 1;
        }

        @media (max-width: 1000px) {
            .lzy_flex {
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <h1 class="lzy_title">李知芸的flex</h1>

    <div class="lzy_flex">
        <div class="lzy_box lzy_box1">
            <div class="lzy_item lzy_item1"></div>
        </div>

        <div class="lzy_box lzy_box2">
            <div class="lzy_item lzy_item2"></div>
            <div class="lzy_item lzy_item2"></div>
        </div>

        <div class="lzy_box lzy_box3">
            <div class="lzy_item lzy_item3"></div>
            <div class="lzy_item lzy_item3"></div>
            <div class="lzy_item lzy_item3"></div>
            <div class="lzy_item lzy_item3"></div>
        </div>

        <div class="lzy_box lzy_box4">
            <div class="lzy_item lzy_item4-top"></div>
            <div class="lzy_row">
                <div class="lzy_item lzy_item4-left"></div>
                <div class="lzy_item lzy_item4-right"></div>
            </div>
        </div>
    </div>
</body>
</html>
