<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17 用户列表</title>
    <link rel="stylesheet" href="./17-api.css">
    <style>
        .lzy_userGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
        .lzy_userCard {
            background-color: #fff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(23, 43, 38, 0.06);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .lzy_userCard:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(23, 43, 38, 0.12);
        }
        .lzy_userHead {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lzy_avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            flex-shrink: 0;
            background: linear-gradient(135deg, #17b78a 0%, #0f8f6d 100%);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .lzy_userName {
            font-size: 16px;
            color: #14251f;
        }
        .lzy_username {
            font-size: 12px;
            color: #8a9a94;
        }
        .lzy_userRows {
            display: grid;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #eef2f0;
            font-size: 13px;
        }
        .lzy_userRow {
            display: flex;
            gap: 8px;
            color: #6b7c76;
            word-break: break-all;
        }
        .lzy_userRow span {
            width: 44px;
            flex-shrink: 0;
            color: #9aa5a1;
        }
    </style>
</head>
<body>
    <!-- 姓名：李知芸  日期：2026-11-02  功能名称：17 用户列表（jsonplaceholder） -->

    <header class="lzy_header">
        <div class="lzy_headerInner">
            <span class="lzy_badge">USER API</span>
            <h1>用户列表</h1>
            <p class="lzy_sub">调用 JSONPlaceholder 接口，获取并展示全部用户信息</p>
        </div>
    </header>

    <main class="lzy_main">
        <section class="lzy_panel">
            <h2 class="lzy_panelTitle">接口信息</h2>
            <code class="lzy_api">GET https://jsonplaceholder.typicode.com/users</code>
            <p class="lzy_hint">接口返回一个数组，每个对象包含姓名、用户名、邮箱、电话、公司、地址等字段。</p>
        </section>

        <section class="lzy_panel">
            <div class="lzy_toolbar">
                <span class="lzy_status" id="lzy_status">正在加载用户列表…</span>
                <button class="lzy_btn" id="lzy_reload" type="button">刷新列表</button>
            </div>
            <div class="lzy_userGrid" id="lzy_grid">
                <div class="lzy_empty">正在请求接口，请稍候…</div>
            </div>
        </section>
    </main>

    <script>
        var lzy_apiUrl = "https://jsonplaceholder.typicode.com/users";
        var lzy_reloadBtn = document.getElementById("lzy_reload");
        var lzy_status = document.getElementById("lzy_status");
        var lzy_grid = document.getElementById("lzy_grid");

        // 转义接口文本，避免特殊字符被解析成 HTML
        function lzy_escapeHtml(lzy_text) {
            return String(lzy_text).replace(/[&<>"']/g, function (lzy_char) {
                var lzy_map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };
                return lzy_map[lzy_char];
            });
        }

        // 取姓名首字母作为头像文字
        function lzy_getInitials(lzy_name) {
            var lzy_words = lzy_name.trim().split(/\s+/);
            var lzy_text = "";
            lzy_words.forEach(function (lzy_word) {
                lzy_text += lzy_word.charAt(0).toUpperCase();
            });
            return lzy_text.slice(0, 2);
        }

        async function lzy_loadUsers() {
            lzy_reloadBtn.disabled = true;
            lzy_status.textContent = "正在加载用户列表…";
            lzy_status.className = "lzy_status";
            lzy_grid.innerHTML = '<div class="lzy_empty">正在请求接口，请稍候…</div>';

            var lzy_startTime = Date.now();
            try {
                var lzy_response = await fetch(lzy_apiUrl, { cache: "no-store" });
                if (!lzy_response.ok) {
                    throw new Error("HTTP 状态码 " + lzy_response.status);
                }
                var lzy_users = await lzy_response.json();

                var lzy_html = "";
                lzy_users.forEach(function (lzy_user) {
                    lzy_html += '<div class="lzy_userCard">'
                        + '<div class="lzy_userHead">'
                        + '<span class="lzy_avatar">' + lzy_getInitials(lzy_user.name) + '</span>'
                        + '<div><h3 class="lzy_userName">' + lzy_escapeHtml(lzy_user.name) + '</h3>'
                        + '<p class="lzy_username">@' + lzy_escapeHtml(lzy_user.username) + '</p></div>'
                        + '</div>'
                        + '<div class="lzy_userRows">'
                        + '<div class="lzy_userRow"><span>邮箱</span>' + lzy_escapeHtml(lzy_user.email) + '</div>'
                        + '<div class="lzy_userRow"><span>电话</span>' + lzy_escapeHtml(lzy_user.phone) + '</div>'
                        + '<div class="lzy_userRow"><span>公司</span>' + lzy_escapeHtml(lzy_user.company.name) + '</div>'
                        + '<div class="lzy_userRow"><span>城市</span>' + lzy_escapeHtml(lzy_user.address.city) + '</div>'
                        + '</div>'
                        + '</div>';
                });
                lzy_grid.innerHTML = lzy_html;

                lzy_status.textContent = "加载成功 · 共 " + lzy_users.length + " 位用户 · 耗时 " + (Date.now() - lzy_startTime) + " ms";
                lzy_status.className = "lzy_status lzy_success";
            } catch (lzy_error) {
                lzy_grid.innerHTML = '<div class="lzy_empty">用户列表加载失败，请点击“刷新列表”重试。</div>';
                lzy_status.textContent = "加载失败：" + lzy_error.message;
                lzy_status.className = "lzy_status lzy_error";
            } finally {
                lzy_reloadBtn.disabled = false;
            }
        }

        lzy_reloadBtn.addEventListener("click", lzy_loadUsers);
        lzy_loadUsers();
    </script>
</body>
</html>
