<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
<style>
    .main{
        display: flex;
        flex-wrap: wrap;
        margin: 10px;
    }
    .box{
        width: 150px;
        height: 150px;
        border: 1px solid #ccc;
        margin: 10px;
        display: flex;

        justify-content: center;
        align-items: center;
        font-size: 40px;
        transition: all 0.6s;
        box-sizing: border-box;
        /*width：包含padding和border*/

    }
    .box:first-child:hover{
        background-color: red;
        color: white;       
        font-size: 140px;

    }
    .box:nth-child(2):hover{
        border-radius: 50%;
        border-width: 10px;
    }
    .box:nth-child(3):hover{
        box-shadow: 10px 10px 10px #b0a9a9;
    }
    .box:nth-of-type(4):hover{
        text-shadow: 10px 10px 10px #b0a9a9;
    }
    .box:nth-of-type(5):hover{
        /*线性渐变*/
        background-image: linear-gradient(to right, rgb(0, 200, 255), rgb(89, 255, 0));
    }
    .box:nth-of-type(5)+.box{
        /*径向渐变*/
        background-image: radial-gradient(circle, rgb(0, 200, 255), rgb(89, 255, 0));
    }
    .box:nth-of-type(7):hover{
        transform:scale(0.5);
    }
    .box:nth-child(8):hover{
        transform:translateX(-150px)
    }
    .box:nth-child(9):hover{
        transform:rotateZ(-180deg);
    }
    .box:nth-child(10):hover{
        transform:skewX(20deg) translateY(50px);
    }
    .box:nth-last-child(2):hove::before{
        content: "*";
        color: brown;
    }

    /*扩展1：第十二个盒子，鼠标在上面显示自己的名字，要求名字深色背景白色文字，水平垂直居中*/

    .box:nth-child(12){
        position: relative;
    }
    .box:nth-child(12):hover::after{
        content:"李知芸";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #333;
        color: #fff;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 16px;
    }
    .box:nth-child(3n):hover{
        border:3px solid red;
    }
    /*扩展2：鼠标在偶数个盒子上时，自定义效果*/
    .box:nth-child(even):hover{
        background-color: #6bdcff;
        color: white;
        transform: rotateZ(360deg) scale(1.2);
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(107, 216, 255, 0.8);
    }


</style>
</style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>

        
    </div>
    
</body>
</html>
