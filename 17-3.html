<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f7f6;
            color: #1f2a27;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .lzy_header {
            background: linear-gradient(135deg, #0d3b30 0%, #14765d 55%, #17b78a 100%);
            color: #fff;
            padding: 46px 24px 42px;
        }
        .lzy_headerInner {
            max-width: 1120px;
            margin: 0 auto;
        }
        .lzy_badge {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 2px;
            padding: 5px 12px;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.16);
            margin-bottom: 14px;
        }
        .lzy_header h1 {
            font-size: 28px;
            letter-spacing: 2px;
        }
        .lzy_sub {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.78);
        }
        .lzy_main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }
        .lzy_toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }
        .lzy_status {
            font-size: 13px;
            color: #8a9a94;
        }
        .lzy_status.lzy_success {
            color: #14765d;
        }
        .lzy_status.lzy_error {
            color: #d64545;
        }
        .lzy_btn {
            padding: 10px 22px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #17b78a 0%, #0f8f6d 100%);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(23, 183, 138, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .lzy_btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(23, 183, 138, 0.38);
        }
        .lzy_btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .lzy_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }
        .lzy_card {
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(23, 43, 38, 0.06);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .lzy_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px rgba(23, 43, 38, 0.13);
        }
        .lzy_thumb {
            position: relative;
            background: linear-gradient(135deg, #f2faf7 0%, #e6f5ee 100%);
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }
        .lzy_thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            transition: transform 0.3s ease;
        }
        .lzy_card:hover .lzy_thumb img {
            transform: scale(1.05);
        }
        .lzy_cardBody {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .lzy_tag {
            align-self: flex-start;
            font-size: 11px;
            color: #17b78a;
            background-color: #eafaf3;
            border-radius: 999px;
            padding: 2px 10px;
            margin-bottom: 8px;
            text-transform: capitalize;
        }
        .lzy_name {
            font-size: 15px;
            color: #1e2a27;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .lzy_brand {
            margin-top: 6px;
            font-size: 12px;
            color: #9aa5a1;
        }
        .lzy_priceRow {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 12px;
        }
        .lzy_price {
            font-size: 18px;
            color: #0f8f6d;
            font-weight: bold;
        }
        .lzy_rating {
            font-size: 12px;
            color: #b58900;
        }
        .lzy_more {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eef2f0;
            font-size: 12px;
            color: #8a9a94;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lzy_card:hover .lzy_more {
            color: #17b78a;
        }
        .lzy_empty {
            grid-column: 1 / -1;
            background-color: #fff;
            border-radius: 16px;
            padding: 46px 20px;
            text-align: center;
            color: #8a9a94;
            font-size: 14px;
            box-shadow: 0 6px 18px rgba(23, 43, 38, 0.06);
        }
        @media (max-width: 600px) {
            .lzy_header {
                padding: 34px 18px 30px;
            }
            .lzy_header h1 {
                font-size: 22px;
            }
            .lzy_main {
                padding: 20px 16px 48px;
            }
            .lzy_grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .lzy_cardBody {
                padding: 12px;
            }
            .lzy_name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 姓名：李知芸  日期：2026-11-02  功能名称：17-3 商品列表（fetch 接口数据） -->

    <header class="lzy_header">
        <div class="lzy_headerInner">
            <span class="lzy_badge">PRODUCT LIST</span>
            <h1>商品列表</h1>
            <p class="lzy_sub">数据来源：https://dummyjson.com/products?limit=8 · 使用 fetch 获取并渲染</p>
        </div>
    </header>

    <main class="lzy_main">
        <div class="lzy_toolbar">
            <span class="lzy_status" id="lzy_status">正在加载商品列表…</span>
            <button class="lzy_btn" id="lzy_reload" type="button">刷新列表</button>
        </div>

        <div class="lzy_grid" id="lzy_grid">
            <div class="lzy_empty" id="lzy_empty">正在请求接口，请稍候…</div>
        </div>
    </main>

    <script>
        var lzy_listUrl = "https://dummyjson.com/products?limit=8";
        var lzy_grid = document.getElementById("lzy_grid");
        var lzy_status = document.getElementById("lzy_status");
        var lzy_reloadBtn = document.getElementById("lzy_reload");

        // 转义接口文本，避免把特殊字符当成 HTML 解析
        function lzy_escapeHtml(lzy_text) {
            return String(lzy_text).replace(/[&<>"']/g, function (lzy_char) {
                var lzy_map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };
                return lzy_map[lzy_char];
            });
        }

        // 请求列表数据并渲染成卡片
        async function lzy_loadList() {
            lzy_reloadBtn.disabled = true;
            lzy_status.textContent = "正在加载商品列表…";
            lzy_status.className = "lzy_status";
            lzy_grid.innerHTML = '<div class="lzy_empty">正在请求接口，请稍候…</div>';

            var lzy_startTime = Date.now();
            try {
                var lzy_response = await fetch(lzy_listUrl, { cache: "no-store" });
                if (!lzy_response.ok) {
                    throw new Error("HTTP 状态码 " + lzy_response.status);
                }
                var lzy_data = await lzy_response.json();
                var lzy_products = lzy_data.products;

                var lzy_html = "";
                lzy_products.forEach(function (lzy_product) {
                    lzy_html += '<a class="lzy_card" href="17-3-detail.html?id=' + lzy_product.id + '">'
                        + '<div class="lzy_thumb"><img src="' + lzy_escapeHtml(lzy_product.thumbnail) + '" alt="' + lzy_escapeHtml(lzy_product.title) + '" loading="lazy"></div>'
                        + '<div class="lzy_cardBody">'
                        + '<span class="lzy_tag">' + lzy_escapeHtml(lzy_product.category) + '</span>'
                        + '<h3 class="lzy_name">' + lzy_escapeHtml(lzy_product.title) + '</h3>'
                        + '<p class="lzy_brand">品牌：' + lzy_escapeHtml(lzy_product.brand || "暂无") + '</p>'
                        + '<div class="lzy_priceRow">'
                        + '<strong class="lzy_price">$' + lzy_product.price.toFixed(2) + '</strong>'
                        + '<span class="lzy_rating">★ ' + lzy_product.rating.toFixed(1) + '</span>'
                        + '</div>'
                        + '<div class="lzy_more"><span>库存 ' + lzy_product.stock + ' 件</span><span>查看详情 ›</span></div>'
                        + '</div>'
                        + '</a>';
                });
                lzy_grid.innerHTML = lzy_html;

                lzy_status.textContent = "加载成功 · 共 " + lzy_products.length + " 件商品 · 耗时 " + (Date.now() - lzy_startTime) + " ms";
                lzy_status.className = "lzy_status lzy_success";
            } catch (lzy_error) {
                lzy_grid.innerHTML = '<div class="lzy_empty">商品列表加载失败，请检查网络后点击“刷新列表”重试。</div>';
                lzy_status.textContent = "加载失败：" + lzy_error.message;
                lzy_status.className = "lzy_status lzy_error";
            } finally {
                lzy_reloadBtn.disabled = false;
            }
        }

        lzy_reloadBtn.addEventListener("click", lzy_loadList);
        lzy_loadList();
    </script>
</body>
</html>
