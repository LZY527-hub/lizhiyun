<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;

        }
        .a{
            width: 500px;
            height: 500px;
            background: red;
            padding: 70px 60px 50px 40px;
            border: 2px dotted #039;
            margin: 40px auto;

        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px solid #039;
            margin: 50px auto 40px;

        }
        .c{
            width: 500px;
            height: 200px;
            background: #ffd700;
            border: 2px solid #039;
            margin: 0 auto 40px;

        }
    </style>
</head>
<body>
    <div class="a">527李知芸</div>
    <div class="b">527李知芸</div>
    <div class="c">527李知芸</div>

</body>
</html>
