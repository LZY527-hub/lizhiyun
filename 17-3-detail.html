<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f7f6;
            color: #1f2a27;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .lzy_header {
            background: linear-gradient(135deg, #0d3b30 0%, #14765d 55%, #17b78a 100%);
            color: #fff;
            padding: 40px 24px 36px;
        }
        .lzy_headerInner {
            max-width: 1080px;
            margin: 0 auto;
        }
        .lzy_back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.86);
            margin-bottom: 16px;
            transition: color 0.2s ease;
        }
        .lzy_back:hover {
            color: #fff;
        }
        .lzy_header h1 {
            font-size: 26px;
            letter-spacing: 2px;
        }
        .lzy_sub {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            word-break: break-all;
        }
        .lzy_main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }
        .lzy_status {
            font-size: 13px;
            color: #8a9a94;
            margin-bottom: 16px;
        }
        .lzy_status.lzy_success {
            color: #14765d;
        }
        .lzy_status.lzy_error {
            color: #d64545;
        }
        .lzy_card {
            background-color: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 26px rgba(23, 43, 38, 0.07);
            overflow: hidden;
        }
        .lzy_detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .lzy_gallery {
            background: linear-gradient(135deg, #f2faf7 0%, #e6f5ee 100%);
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lzy_mainImg {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 12px;
            background-color: #fff;
        }
        .lzy_thumbs {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .lzy_thumbBtn {
            width: 64px;
            height: 64px;
            padding: 4px;
            border: 2px solid transparent;
            border-radius: 10px;
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .lzy_thumbBtn.lzy_on {
            border-color: #17b78a;
        }
        .lzy_thumbBtn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .lzy_info {
            padding: 30px 32px 32px;
            display: flex;
            flex-direction: column;
        }
        .lzy_tag {
            align-self: flex-start;
            font-size: 12px;
            color: #17b78a;
            background-color: #eafaf3;
            border-radius: 999px;
            padding: 3px 12px;
            margin-bottom: 12px;
            text-transform: capitalize;
        }
        .lzy_title {
            font-size: 24px;
            line-height: 1.4;
            color: #14251f;
        }
        .lzy_desc {
            margin-top: 12px;
            font-size: 14px;
            color: #6b7c76;
        }
        .lzy_priceRow {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .lzy_price {
            font-size: 30px;
            color: #0f8f6d;
            font-weight: bold;
        }
        .lzy_discount {
            font-size: 12px;
            color: #d64545;
            background-color: #fdecec;
            border-radius: 6px;
            padding: 2px 8px;
        }
        .lzy_rating {
            font-size: 13px;
            color: #b58900;
        }
        .lzy_specs {
            margin-top: 22px;
            border-top: 1px solid #eef2f0;
        }
        .lzy_specRow {
            display: flex;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #f3f6f5;
            font-size: 13px;
        }
        .lzy_specRow span {
            width: 92px;
            flex-shrink: 0;
            color: #9aa5a1;
        }
        .lzy_specRow b {
            font-weight: normal;
            color: #2a3a34;
            word-break: break-word;
        }
        .lzy_stockLine {
            margin-top: 18px;
            font-size: 13px;
            color: #14765d;
            background-color: #f2faf7;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .lzy_empty {
            background-color: #fff;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            color: #8a9a94;
            font-size: 14px;
            box-shadow: 0 8px 26px rgba(23, 43, 38, 0.07);
        }
        @media (max-width: 820px) {
            .lzy_detail {
                grid-template-columns: 1fr;
            }
            .lzy_info {
                padding: 22px;
            }
        }
        @media (max-width: 600px) {
            .lzy_header {
                padding: 30px 18px 26px;
            }
            .lzy_header h1 {
                font-size: 21px;
            }
            .lzy_main {
                padding: 20px 16px 48px;
            }
            .lzy_gallery {
                padding: 18px;
            }
            .lzy_title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 姓名：李知芸  日期：2026-11-02  功能名称：17-3 商品详情（根据 ID 获取单个商品） -->

    <header class="lzy_header">
        <div class="lzy_headerInner">
            <a class="lzy_back" href="17-3.html">‹ 返回商品列表</a>
            <h1>商品详情</h1>
            <p class="lzy_sub" id="lzy_apiText">正在获取商品数据…</p>
        </div>
    </header>

    <main class="lzy_main">
        <p class="lzy_status" id="lzy_status">正在加载商品详情…</p>
        <div id="lzy_detailWrap">
            <div class="lzy_empty">正在请求接口，请稍候…</div>
        </div>
    </main>

    <script>
        // 从地址栏读取商品 ID，例如 17-3-detail.html?id=1
        var lzy_params = new URLSearchParams(window.location.search);
        var lzy_productId = parseInt(lzy_params.get("id"), 10) || 1;
        var lzy_apiUrl = "https://dummyjson.com/products/" + lzy_productId;
        var lzy_status = document.getElementById("lzy_status");
        var lzy_detailWrap = document.getElementById("lzy_detailWrap");

        // 转义接口文本，避免特殊字符被解析成 HTML
        function lzy_escapeHtml(lzy_text) {
            return String(lzy_text).replace(/[&<>"']/g, function (lzy_char) {
                var lzy_map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };
                return lzy_map[lzy_char];
            });
        }

        // 根据 ID 获取单个商品并渲染
        async function lzy_loadDetail() {
            document.getElementById("lzy_apiText").textContent = "数据来源：" + lzy_apiUrl;

            var lzy_startTime = Date.now();
            try {
                var lzy_response = await fetch(lzy_apiUrl, { cache: "no-store" });
                if (!lzy_response.ok) {
                    throw new Error("HTTP 状态码 " + lzy_response.status);
                }
                var lzy_product = await lzy_response.json();
                var lzy_images = lzy_product.images || [lzy_product.thumbnail];

                var lzy_thumbs = "";
                lzy_images.slice(0, 4).forEach(function (lzy_src, lzy_index) {
                    lzy_thumbs += '<button class="lzy_thumbBtn' + (lzy_index === 0 ? " lzy_on" : "") + '" type="button" data-src="' + lzy_escapeHtml(lzy_src) + '">'
                        + '<img src="' + lzy_escapeHtml(lzy_src) + '" alt="商品图片 ' + (lzy_index + 1) + '">'
                        + '</button>';
                });

                lzy_detailWrap.innerHTML = '<div class="lzy_card"><div class="lzy_detail">'
                    + '<div class="lzy_gallery">'
                    + '<img class="lzy_mainImg" id="lzy_mainImg" src="' + lzy_escapeHtml(lzy_images[0]) + '" alt="' + lzy_escapeHtml(lzy_product.title) + '">'
                    + '<div class="lzy_thumbs">' + lzy_thumbs + '</div>'
                    + '</div>'
                    + '<div class="lzy_info">'
                    + '<span class="lzy_tag">' + lzy_escapeHtml(lzy_product.category) + '</span>'
                    + '<h2 class="lzy_title">' + lzy_escapeHtml(lzy_product.title) + '</h2>'
                    + '<p class="lzy_desc">' + lzy_escapeHtml(lzy_product.description) + '</p>'
                    + '<div class="lzy_priceRow">'
                    + '<strong class="lzy_price">$' + lzy_product.price.toFixed(2) + '</strong>'
                    + '<span class="lzy_discount">-' + lzy_product.discountPercentage.toFixed(2) + '%</span>'
                    + '<span class="lzy_rating">★ ' + lzy_product.rating.toFixed(2) + '</span>'
                    + '</div>'
                    + '<div class="lzy_specs">'
                    + '<div class="lzy_specRow"><span>品牌</span><b>' + lzy_escapeHtml(lzy_product.brand || "暂无") + '</b></div>'
                    + '<div class="lzy_specRow"><span>商品编号</span><b>' + lzy_escapeHtml(lzy_product.sku) + '</b></div>'
                    + '<div class="lzy_specRow"><span>保修政策</span><b>' + lzy_escapeHtml(lzy_product.warrantyInformation) + '</b></div>'
                    + '<div class="lzy_specRow"><span>发货说明</span><b>' + lzy_escapeHtml(lzy_product.shippingInformation) + '</b></div>'
                    + '<div class="lzy_specRow"><span>退换政策</span><b>' + lzy_escapeHtml(lzy_product.returnPolicy) + '</b></div>'
                    + '</div>'
                    + '<div class="lzy_stockLine">库存 ' + lzy_product.stock + ' 件 · ' + lzy_escapeHtml(lzy_product.availabilityStatus) + '</div>'
                    + '</div>'
                    + '</div></div>';

                // 点击缩略图切换主图
                var lzy_thumbBtns = document.querySelectorAll(".lzy_thumbBtn");
                for (var lzy_i = 0; lzy_i < lzy_thumbBtns.length; lzy_i++) {
                    lzy_thumbBtns[lzy_i].addEventListener("click", function () {
                        for (var lzy_j = 0; lzy_j < lzy_thumbBtns.length; lzy_j++) {
                            lzy_thumbBtns[lzy_j].className = "lzy_thumbBtn";
                        }
                        this.className = "lzy_thumbBtn lzy_on";
                        document.getElementById("lzy_mainImg").src = this.getAttribute("data-src");
                    });
                }

                document.title = lzy_product.title + " - 商品详情";
                lzy_status.textContent = "加载成功 · 商品 ID " + lzy_product.id + " · 耗时 " + (Date.now() - lzy_startTime) + " ms";
                lzy_status.className = "lzy_status lzy_success";
            } catch (lzy_error) {
                lzy_detailWrap.innerHTML = '<div class="lzy_empty">商品详情加载失败（' + lzy_escapeHtml(lzy_error.message) + '），请确认 ID 是否正确或稍后重试。</div>';
                lzy_status.textContent = "加载失败：" + lzy_error.message;
                lzy_status.className = "lzy_status lzy_error";
            }
        }

        lzy_loadDetail();
    </script>
</body>
</html>
