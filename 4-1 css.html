<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>527 李知芸</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            padding:8px;
            margin:20px;
            border:1px solid black;
            font-size:16px;
            width:480px;
        }
        #box h3{
            font-size:16px;

            Line-height:33px;
            text-align: center;

            color:#034;
            /*字数间距*/
            
            letter-spacing:2px;
        }
        #box>p{
            color:#666;

            text-indent:2em;

            line-height:150%;
        }
        #box a{
            color:#c00;

            text-decoration:none;
        }
        /* 扩展2：h2 黑底白字 居中 行高150% */
        h2{
            background:#000;
            color:#fff;
            text-align:center;
            line-height:150%;
        }
        /* 扩展1：学号、姓名、班级的值 —— 蓝色加粗（一个选择器） */
        #box .stu{
            color:blue;
            font-weight:bold;
        }
        /* 扩展3：知识点的值 —— 蓝底白字 */
        #box .kp{
            background:blue;
            color:#fff;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p> 学号：<b class="stu">527</b>，姓名：<b class="stu">李知芸</b>, 班级：<b class="stu">计算机24005</b>，《高级网页设计》设计的学习难度：中等，
            本实例的知识点：<span class="kp">CSS 群组选择器和后代选择器</span>。
            <a href="#"> 更多 </a>
        </p>

    </div>
    <!-- 扩展：学号，姓名，班级的值是蓝色加粗，使用一个CSS选择器
     2，h2黑底白字
     3，知识点的值蓝底白字。
     -->


</body>
</html>
