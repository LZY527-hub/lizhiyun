<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李知芸 · 个人主页</title>
    <style>
        :root {
            --bg-1: #667eea;
            --bg-2: #764ba2;
            --card: rgba(255, 255, 255, 0.9);
            --text: #2d3748;
            --muted: #718096;
            --accent: #667eea;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 400% 400%;
            animation: gradient-shift 12s ease infinite;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradient-shift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 粒子画布 */
        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--card);
            border-radius: 24px;
            padding: 56px 48px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            will-change: transform;
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 40px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        /* 头像光环 */
        .avatar::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(102, 126, 234, 0.5);
            animation: ripple 2.5s ease-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        @keyframes ripple {
            0%   { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .id {
            display: inline-block;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        /* 打字机光标 */
        .subtitle {
            color: var(--muted);
            font-size: 15px;
            min-height: 22px;
            margin-bottom: 32px;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: -2px;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        .divider {
            width: 48px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin: 0 auto 28px;
            position: relative;
            overflow: hidden;
        }
        .divider::before {
            content: "";
            position: absolute;
            inset: 0;
            background: #fff;
            animation: shine 2s linear infinite;
        }
        @keyframes shine {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            background: #eef2ff;
            color: var(--accent);
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
            cursor: default;
        }
        .tag:hover {
            transform: translateY(-3px) scale(1.05);
            background: var(--accent);
            color: #fff;
        }

        @media (max-width: 480px) {
            .card { padding: 40px 28px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <div class="card" id="card">
        <div class="avatar">李</div>
        <span class="id">No. 527</span>
        <h1>李知芸</h1>
        <p class="subtitle" id="typewriter"></p>
        <div class="divider"></div>
        <div class="tags">
            <span class="tag">💻 网页设计</span>
            <span class="tag">🎨 前端开发</span>
            <span class="tag">✨ 创意无限</span>
        </div>
    </div>

    <script>
        // ============ 粒子背景 ============
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // 鼠标排斥
                if (mouse.x != null) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 120) {
                        const force = (120 - dist) / 120;
                        this.x += (dx / dist) * force * 2;
                        this.y += (dy / dist) * force * 2;
                    }
                }

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            const count = Math.min(120, Math.floor(window.innerWidth / 12));
            particles = Array.from({ length: count }, () => new Particle());
        }
        initParticles();
        window.addEventListener('resize', initParticles);

        function connect() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i], b = particles[j];
                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * (1 - dist / 110)})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            connect();
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // ============ 卡片 3D 倾斜 ============
        const card = document.getElementById('card');
        window.addEventListener('mousemove', e => {
            const rect = card.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = (e.clientX - cx) / rect.width;
            const dy = (e.clientY - cy) / rect.height;
            const rotateY = dx * 12;
            const rotateX = -dy * 12;
            card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            card.style.boxShadow = `${-dx * 20}px ${dy * 20}px 60px rgba(0,0,0,0.3)`;
        });
        window.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
            card.style.boxShadow = '0 20px 60px rgba(0,0,0,0.25)';
        });

        // ============ 打字机效果 ============
        const phrases = [
            '你好，欢迎来到我的个人主页',
            '热爱设计与创造 ✨',
            '正在学习高级网页设计',
            '用代码描绘美好世界'
        ];
        const el = document.getElementById('typewriter');
        let pi = 0, ci = 0, deleting = false;

        function type() {
            const current = phrases[pi];
            if (!deleting) {
                ci++;
                el.innerHTML = current.slice(0, ci) + '<span class="cursor"></span>';
                if (ci === current.length) {
                    deleting = true;
                    setTimeout(type, 1600);
                    return;
                }
                setTimeout(type, 90);
            } else {
                ci--;
                el.innerHTML = current.slice(0, ci) + '<span class="cursor"></span>';
                if (ci === 0) {
                    deleting = false;
                    pi = (pi + 1) % phrases.length;
                }
                setTimeout(type, 45);
            }
        }
        type();
    </script>
</body>
</html>
