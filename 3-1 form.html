<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>527 李知芸</title>
</head>
<body>
    <h2>表单form</h2>
     <form action="http://huanqiu.com" name="y1">
        <p>用户名: <input type="text" name="username" placeholder="请输入用户名"></p>
        <p>密码: <input type="password" name="password" placeholder="请输入密码"></p>
        <p><input type="submit" value="提交"></p>

        <!-- 性别: 男、女、保密 -->
        <p>性别:
            <input type="radio" name="sex" value="male" checked>男
            <input type="radio" name="sex" value="female">女
            <input type="radio" name="sex" value="secret">保密
        </p>


        <p>爱好:
        <input type="checkbox" name="hobbies" value="basketball">篮球
        <input type="checkbox" name="hobbies" value="football">足球
        <input type="checkbox" name="hobbies" value="badminton">羽毛球
        <input type="checkbox" name="hobbies" value="table‑tennis">乒乓球
        </p>

        <p>籍贯:
        <select name="birthplace">
            <option value="">请选择籍贯</option>
            <option value="beijing">北京</option>
            <option value="shanghai">上海</option>
            <option value="tianjin">天津</option>
            <option value="chongqing">重庆</option>
            <option value="hebei">河北</option>
            <option value="shanxi">山西</option>
            <option value="liaoning">辽宁</option>
            <option value="jilin">吉林</option>
            <option value="heilongjiang">黑龙江</option>
            <option value="jiangsu">江苏</option>
            <option value="zhejiang">浙江</option>
            <option value="anhui">安徽</option>
            <option value="fujian">福建</option>
            <option value="jiangxi">江西</option>
            <option value="shandong">山东</option>
            <option value="henan">河南</option>
            <option value="hubei">湖北</option>
            <option value="hunan">湖南</option>
            <option value="guangdong">广东</option>
            <option value="hainan">海南</option>
            <option value="sichuan">四川</option>
            <option value="guizhou">贵州</option>
            <option value="yunnan">云南</option>
            <option value="shaanxi">陕西</option>
            <option value="gansu">甘肃</option>
            <option value="qinghai">青海</option>
            <option value="taiwan">台湾</option>
            <option value="neimenggu">内蒙古</option>
            <option value="guangxi">广西</option>
            <option value="xizang">西藏</option>
            <option value="ningxia">宁夏</option>
            <option value="xinjiang">新疆</option>
            <option value="xianggang">香港</option>
            <option value="aomen">澳门</option>
        </select>
        </p>


        <p>个人介绍:<br>
            <textarea name="intro" rows="5" cols="40" placeholder="请输入个人介绍"></textarea>
        </p>

        <p>出生日期: <input type="date" name="birthday"></p>

        <p>上传文件: <input type="file" name="upload"></p>

        <p>
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
            <input type="button" value="普通按钮">
        </p>  




    </form>

    <button>按钮</button>

</body>
</html>
